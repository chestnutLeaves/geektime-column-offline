server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;

    # 即使将完整项目根目录挂载为网站，也不公开隐藏文件或维护资料。
    location ~ (^|/)\. { return 404; }
    location = / { try_files /index.html =404; }
    location ~ ^/(index|about|course-sources)\.html$ { try_files $uri =404; }
    location ~ ^/(assets|static)/ {
        try_files $uri =404;
        expires 7d;
    }
    location ~ ^/(courses|articles|geektime|relationships|downloads)(/|$) {
        try_files $uri $uri/ =404;
    }
    location / { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff;
}
